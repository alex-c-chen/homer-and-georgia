[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.18.4",
    "alembic-postgresql-enum>=1.10.0",
    "anthropic>=0.104.1",
    "boto3>=1.43.14",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (moves pure-type imports into TYPE_CHECKING blocks)
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # Depends() in FastAPI signatures is the correct pattern
    "TCH",   # TYPE_CHECKING splits break FastAPI DI resolution at runtime
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
# ty is alpha (0.0.x); run: uv run ty check .
# Treat errors as advisory until 1.0
