name: HomerAndGeorgia
options:
  bundleIdPrefix: com.alexchen
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES

targets:
  HomerAndGeorgia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomerAndGeorgia
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexchen.homerandgeorgia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      environmentVariables:
        API_BASE_URL: http://localhost:8080
        API_SECRET: ""
